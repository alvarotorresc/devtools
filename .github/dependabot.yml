version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Global constraint: the 2.x line is AGPL-3.0 (this project pins the MIT 1.x line by hand).
      - dependency-name: ua-parser-js
        update-types: [version-update:semver-major]
      # Global constraint: TypeScript 7 breaks @astrojs/check and @astrojs/svelte's peer deps.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
