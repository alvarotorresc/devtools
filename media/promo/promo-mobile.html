<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Promo mobile</title>
    <link rel="stylesheet" href="../../node_modules/@fontsource-variable/unbounded/index.css" />
    <link
      rel="stylesheet"
      href="../../node_modules/@fontsource-variable/instrument-sans/index.css"
    />
    <link rel="stylesheet" href="../../node_modules/@fontsource/ibm-plex-mono/500.css" />
    <link rel="stylesheet" href="promo.css" />
    <style>
      .copy {
        position: absolute;
        top: 50%;
        left: 160px;
        width: 900px;
        transform: translateY(-50%);
      }
      .tagline {
        font-size: 40px;
        color: #edece8;
      }
      ul {
        margin: 44px 0 52px;
        padding: 0;
        list-style: none;
        font-size: 30px;
        color: #a09f9b;
      }
      li {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-top: 14px;
      }
      li::before {
        content: '';
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: #ff5a1f;
      }
      .phone {
        position: absolute;
        top: 50%;
        right: 250px;
        width: 438px;
        padding: 14px;
        transform: translateY(-50%) rotate(2deg);
        border-radius: 58px;
        background: #0e0f10;
        border: 2px solid #393a3f;
        box-shadow:
          0 50px 120px rgb(0 0 0 / 0.6),
          inset 0 0 0 2px #26272b;
      }
      .phone img {
        display: block;
        width: 438px;
        height: auto;
        border-radius: 44px;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="accent"></div>
      <h1 class="wordmark">devtools</h1>
      <p class="tagline" data-t="taglineShort"></p>
      <ul data-bullets></ul>
      <div class="screen">
        <span class="led"></span><span data-t="count"></span>
        <span class="sep"></span>
        <span class="led"></span><span data-t="sent"></span>
      </div>
    </div>
    <div class="phone"><img id="shot" alt="" /></div>
    <script src="promo.js"></script>
  </body>
</html>
