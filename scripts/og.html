<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/unbounded/index.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource-variable/instrument-sans/index.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/500.css" />
    <style>
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-sizing: border-box;
        padding: 72px 80px;
        background: #161719;
        color: #edece8;
        font-family: 'Instrument Sans Variable', sans-serif;
      }
      h1 {
        margin: 0;
        font: 700 96px/1 'Unbounded Variable', sans-serif;
        letter-spacing: -0.04em;
      }
      p {
        margin: 20px 0 0;
        font-size: 32px;
        color: #a09f9b;
        max-width: 900px;
      }
      .screen {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 28px 32px;
        background: #0e0f10;
        border: 1px solid #26272b;
        border-radius: 14px;
        box-shadow: inset 0 2px 10px rgb(0 0 0 / 0.6);
        font: 500 34px 'IBM Plex Mono', monospace;
        letter-spacing: 0.06em;
        color: #ffc266;
      }
      .led {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #2bd46b;
        box-shadow: 0 0 14px #2bd46b;
      }
      .kicker {
        margin: 36px 0 0;
        font: 500 28px 'IBM Plex Mono', monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ffc266;
      }
      .kicker[hidden] {
        display: none;
      }
      h1 small {
        display: block;
        margin-top: 14px;
        font-size: 0.55em;
        color: #a09f9b;
        letter-spacing: -0.03em;
      }
      .accent {
        width: 120px;
        height: 12px;
        background: #ff5a1f;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="accent"></div>
      <p class="kicker" id="kicker" hidden>devtools</p>
      <h1 id="title" style="margin-top: 36px">devtools</h1>
      <p id="sub">
        JSON, UUID, JWT, Base64, hashes… Todo en tu navegador · Everything in your browser.
      </p>
    </div>
    <div class="screen"><span class="led"></span><span id="url">devtools.alvarotc.com</span></div>
  </body>
</html>
